[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palm-passport"
version = "0.1.0"
description = "Per-plot intelligence for Indonesian oil palm smallholders, built on Google Earth Engine."
requires-python = ">=3.10"
dependencies = ["earthengine-api>=1.0"]

[project.optional-dependencies]
notebooks = ["geemap", "matplotlib"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
